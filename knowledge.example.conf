# Knowledge bases for Open WebUI. Copy this file to knowledge.conf (git ignores it: your data stays yours),
# list your files, then run `agent configure`. Each knowledge base is emptied and filled again on every run.
# One per line:  Name: pattern, pattern
# Paths are relative to the projects folder; ** matches subfolders. Text files work best (.md, .txt, source).
# Example:
# MyProject: MyProject/README.md, MyProject/docs/**/*.md
