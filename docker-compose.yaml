# Local agent stack. Started by agent.ps1 (Windows) / agent.sh (Linux, macOS) - use those, not docker compose directly.
#   ollama:        only with --profile docker-ollama (Windows, Linux). macOS runs Ollama natively: Docker there has no GPU.
#   open-terminal: only with --profile docker-terminal (every OS): the agent runs Linux commands on the mounted
#                  projects folder. Nothing to install on the computer.
#   searxng:       always: web search for Open WebUI (internal only, no port published).
#   open-webui:    always.
# GPU: docker-compose.gpu.yaml is added on top when an NVIDIA GPU is found.
# restart: "no" everywhere: nothing starts on its own (also after a reboot), only agent up / down.
# Fixed, tested versions (never latest/main): a pull never brings a new release. To upgrade, change the tags here,
# test, commit.
name: local-agent

services:
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:0.40.13
    container_name: ollama
    restart: "no"
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Ollama's default context (4096 tokens) is too small for an agent loop.
      - OLLAMA_CONTEXT_LENGTH=32768
      # Flash attention + q8_0 KV cache roughly halve the context's VRAM.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Unload after 30 idle minutes: frees the GPU for other work.
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      # A Docker volume, never a Windows folder: through a bind mount F:\models read at ~140 MB/s (measured) and a
      # 13 GB model took minutes to load. Fill it with: agent import-models <folder>, or agent pull <model>.
      - ollama_data:/root/.ollama

  open-terminal:
    profiles: ["docker-terminal"]
    image: ghcr.io/open-webui/open-terminal:0.14.6
    container_name: open-terminal
    restart: "no"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?missing - run agent setup, it creates .env}
    volumes:
      # The projects folder (OT_CWD, set by agent.sh) under the terminal's home; Open WebUI reads AGENTS.md from home.
      - ${OT_CWD:-..}:/home/user/projects
      - ${OT_CWD:-..}/AGENTS.md:/home/user/AGENTS.md:ro

  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    container_name: searxng
    restart: "no"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?missing - run agent setup, it adds it to .env}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: open-webui
    restart: "no"
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # Applied on the very first start only: afterwards Open WebUI keeps what is saved in its database
      # (Admin > Settings). OLLAMA_URL is set by agent.sh on macOS (native Ollama).
      - OLLAMA_BASE_URL=${OLLAMA_URL:-http://ollama:11434}
      - DEFAULT_MODELS=${DEFAULT_MODEL:-gpt-oss:20b}
      # Titles etc. on the chat model, so they never load a second model (only one fits in 16 GB VRAM).
      - TASK_MODEL=${DEFAULT_MODEL:-gpt-oss:20b}
      - ENABLE_FOLLOW_UP_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_MEMORIES=True
      # Web search through the searxng service; search queries leave the computer, nothing else does.
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=3
      # Interface in English, not the browser's language (a browser that saved its own choice keeps it).
      - DEFAULT_LOCALE=en-US
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?missing - run agent setup, it creates .env}
      # Creates the admin account when there is none yet (fresh install); agent configure signs in with it.
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME:-Admin}
      # Needed for the Open Terminal connection (Admin > Integrations).
      - ENABLE_TOOL_SERVERS=True
    extra_hosts:
      # Reaches native Ollama on macOS.
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui_data:/app/backend/data

volumes:
  open-webui_data:
  ollama_data:
